name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  analyze-test:
    name: Analyze and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android emulator
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Run integration test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d emulator-5554
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
      - name: Verify screenshots
        run: |
          for screen in catalog product-details cart order-confirmation; do
            test -s "build/screenshots/$screen.png" || { echo "::error::Missing screenshot: $screen"; exit 1; }
          done
      - name: Upload Android screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: build/screenshots/*.png
          if-no-files-found: error

  ios:
    name: iOS simulator
    needs: analyze-test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Boot an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build for simulator
        run: flutter build ios --simulator --debug
      - name: Run integration test on simulator
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d ${{ steps.sim.outputs.udid }}
      - name: Zip Runner.app
        if: always()
        run: |
          if [ -d build/ios/iphonesimulator/Runner.app ]; then
            cd build/ios/iphonesimulator && zip -qr ../../Runner-simulator.zip Runner.app
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator-build
          path: build/Runner-simulator.zip
          if-no-files-found: warn
      - name: Verify screenshots
        run: |
          for screen in catalog product-details cart order-confirmation; do
            test -s "build/screenshots/$screen.png" || { echo "::error::Missing screenshot: $screen"; exit 1; }
          done
      - name: Upload iOS screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-screenshots
          path: build/screenshots/*.png
          if-no-files-found: error

  web:
    name: Web build
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy-pages:
    name: Deploy web preview to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, android, ios]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
